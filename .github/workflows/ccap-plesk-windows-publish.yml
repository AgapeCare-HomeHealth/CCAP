name: CCAP Windows Plesk publish
on:
  workflow_dispatch:
  push:
    branches: [development, dev-dave1]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore CCAP.sln
          dotnet build CCAP.sln -c Release --no-restore
      - name: Publish API and Web
        shell: pwsh
        run: |
          dotnet publish CCAP.API/CCAP.API.csproj -c Release --no-restore -o publish/api
          dotnet publish CCAP.Web/CCAP.Web.csproj -c Release --no-restore -o publish/web
          if (!(Test-Path publish/web/wwwroot/js/ccap-referral-pdf-ocr.js)) { throw 'Missing browser OCR JavaScript' }
          if (!(Test-Path publish/web/wwwroot/ocr/lang/eng.traineddata.gz)) { throw 'Missing bundled English OCR model' }
          # Keep base/Production non-secret configuration (form profiles, safe defaults).
          # Never publish Development settings. Production secrets must be overridden
          # by Plesk environment variables / protected settings.
          Remove-Item publish/api/appsettings.Development.json -ErrorAction SilentlyContinue
          Remove-Item publish/web/appsettings.Development.json -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: ccap-windows-plesk-api
          path: publish/api
      - uses: actions/upload-artifact@v4
        with:
          name: ccap-windows-plesk-web
          path: publish/web
