name: CCAP CI/CD

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

env:
  DOTNET_VERSION: '10.0.x'

jobs:

  build-test-publish:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Verify SDK
      - name: Display .NET version
        run: dotnet --info

      # 4. Restore entire solution
      - name: Restore
        run: dotnet restore CCAP.sln

      # 5. Build entire solution
      - name: Build
        run: dotnet build CCAP.sln --configuration Release --no-restore

      # 6. Run tests
      - name: Test
        run: dotnet test CCAP.sln --configuration Release --no-build --verbosity normal

      # 7. Publish Web
      - name: Publish CCAP.Web
        run: |
          dotnet publish CCAP.Web/CCAP.Web.csproj \
            --configuration Release \
            --no-restore \
            --output ./publish/web

      # 8. Publish API
      - name: Publish CCAP.API
        run: |
          dotnet publish CCAP.API/CCAP.API.csproj \
            --configuration Release \
            --no-restore \
            --output ./publish/api

      # 9. Upload Web artifact
      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccap-web
          path: ./publish/web

      # 10. Upload API artifact
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccap-api
          path: ./publish/api
